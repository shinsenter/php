# Settings for tests/tools/workflow-check.sh

rules:
  unpinned-uses:
    config:
      policies:
        # Actions follow a version tag, and Dependabot updates the tags. They are not pinned to a hash.
        "*": ref-pin
  secrets-inherit:
    # The templates call each other and pass the registry secrets down, so every level inherits them
    disable: true
  dependabot-cooldown:
    # Updates are taken as soon as they are published
    disable: true
