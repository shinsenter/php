################################################################################

name: Build Template

################################################################################
################################################################################

on:
  workflow_call:
    inputs:
      app_name:
        required: true
        type: string
      php_version:
        required: false
        type: string
        default: ""
      server:
        required: false
        type: string
        default: ""
      os:
        required: false
        type: string
        default: alpine
      os_version:
        required: false
        type: string
        default: latest
      tag_prefix:
        required: false
        type: string
        default: ""
      force_build:
        required: false
        type: boolean
        default: false
      continue-on-error:
        required: false
        type: boolean
        default: false
    secrets:
      DOCKER_HUB_ACCESS_TOKEN:
        required: true
      DOCKER_HUB_USERNAME:
        required: true
      DOCKER_HUB_PASSWORD:
        required: true

################################################################################
################################################################################

jobs:
  # Runs build/config.sh once and hands the result to the jobs below. The build
  # runs once per platform on a runner of the same architecture where possible
  # (QEMU is only used for 32-bit ARM), then "merge" publishes one multi-platform tag.
  prepare:
    name: ${{ inputs.php_version }} ${{ inputs.app_name }} ${{ inputs.server }} ${{ inputs.os }} (prepare)
    runs-on: ubuntu-26.04-arm
    env:
      ARCHIVES_REPO: "shinsenter/php-archives"
      MIRROR_REPO: ghcr.io/shinsenter
      PUBLISH_TO_GHCR: "1"
    outputs:
      skip: ${{ steps.plan.outputs.skip }}
      matrix: ${{ steps.plan.outputs.matrix }}
      fingerprint: ${{ steps.plan.outputs.fingerprint }}
      env: ${{ steps.plan.outputs.env }}
    steps:
      -
        uses: actions/download-artifact@v8
        with:
          name: helper_cache
          path: /tmp/helper_cache/

      -
        uses: actions/checkout@v7
        with:
          submodules: 'true'

      -
        name: Generate build config
        continue-on-error: ${{ inputs.continue-on-error }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKER_HUB_PASSWORD }}
          BUILD_TAG_PREFIX: ${{ inputs.tag_prefix }}
          FORCE_BUILD: ${{ inputs.force_build && '1' || '0' }}
          BUILD_ENV_FILE: /tmp/build.env
        run: |
          set -e
          ./build/config.sh "${{ inputs.os }}" "${{ inputs.app_name }}" "${{ inputs.php_version }}" "${{ inputs.server }}"

      -
        id: plan
        name: Plan the platform builds
        run: |
          set -e
          # amd64 and 386 build on x64, arm64 on arm. 32-bit ARM, ppc64le and s390x
          # (base-os and base-s6 only) run under QEMU.
          matrix="$(jq -cn --arg platforms "$BUILD_PLATFORM" '
            $platforms | split(",") | map(select(. != "")) | map({
              platform: .,
              slug: gsub("/"; "-"),
              runner: (if . == "linux/amd64" or . == "linux/386" then "ubuntu-26.04" else "ubuntu-26.04-arm" end),
              qemu: (if test("^linux/arm/") then "arm" elif test("ppc64le|s390x") then ltrimstr("linux/") else "" end)
            })')"
          skip="${SKIP_BUILD:-0}"
          if [ "$matrix" = "[]" ]; then
            skip=1
            matrix='[{"platform":"none","slug":"none","runner":"ubuntu-26.04","qemu":""}]'
          fi
          {
            echo "skip=$skip"
            echo "matrix=$matrix"
            echo "fingerprint=$BUILD_FINGERPRINT"
            echo "env<<EOF_BUILD_ENV"
            cat /tmp/build.env 2>/dev/null || true
            echo "EOF_BUILD_ENV"
          } >> "$GITHUB_OUTPUT"
          echo "skip=$skip matrix=$matrix"

  ##############################################################################

  build:
    name: ${{ inputs.php_version }} ${{ inputs.app_name }} ${{ inputs.server }} ${{ inputs.os }} ${{ matrix.platform }}
    needs: prepare
    if: ${{ needs.prepare.outputs.skip != '1' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    permissions:
      packages: write
      contents: read
    services:
      registry:
        image: registry:2
        ports:
          - '5000:5000'
    env:
      DOCKER_BUILD_RECORD_UPLOAD: false
      DOCKER_BUILD_SUMMARY: false
      DOCKER_BUILDKIT: "1"
      PUBLISH_TO_GHCR: "1"
    steps:
      -
        uses: actions/checkout@v7
        with:
          submodules: 'true'

      -
        name: Load build config
        env:
          BUILD_ENV: ${{ needs.prepare.outputs.env }}
        run: printf '%s\n' "$BUILD_ENV" >> "$GITHUB_ENV"

      -
        name: Prepare build context
        run: |
          set -e
          BASE_DIR="$(git rev-parse --show-toplevel)"
          . ./build/helpers.sh
          prepare_build_context "$BUILD_DOCKERFILE" "$BUILD_CONTEXT" "$PHP_VERSION"

      - # brotli and curl sources for common/patches/middleware-patch
        uses: actions/download-artifact@v8
        with:
          name: helper_cache
          path: ${{ env.BUILD_CONTEXT }}/helper_cache/

      -
        if: ${{ matrix.qemu != '' }}
        uses: docker/setup-qemu-action@v4
        with:
          platforms: ${{ matrix.qemu }}

      -
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host

      -
        uses: ./.github/actions/registry-login
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - # Each platform is pushed by digest, "merge" puts the digests under the tags
        id: stage
        name: Set the staging repository
        run: |
          if [ "$PUBLISH_TO_GHCR" = "1" ]; then
            echo "name=ghcr.io/$BUILD_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "name=$BUILD_NAME" >> "$GITHUB_OUTPUT"
          fi

      - # Squash mode builds a temporary image first, the squashed one is pushed below
        id: build
        name: Build ${{ env.BUILD_TAG }} for ${{ matrix.platform }}
        uses: docker/build-push-action@v7
        continue-on-error: ${{ inputs.continue-on-error }}
        with:
          pull: false
          push: ${{ env.SKIP_SQUASH != '1' }}
          platforms: ${{ matrix.platform }}
          file: ${{ env.BUILD_DOCKERFILE }}
          context: ${{ env.BUILD_CONTEXT }}
          tags: ${{ env.SKIP_SQUASH != '1' && env.BUILD_TMP_NAME || '' }}
          outputs: ${{ env.SKIP_SQUASH == '1' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push={1}', steps.stage.outputs.name, env.SKIP_PUSH != '1') || '' }}
          sbom: true
          build-args: |
            DEBUG=${{ env.DEBUG }}
            BUILD_CACHE_KEY=${{ env.BUILD_CACHE_KEY }}
            BUILD_CONTEXT=${{ env.BUILD_CONTEXT }}
            BUILD_DATE=${{ env.BUILD_DATE }}
            BUILD_DESC=${{ env.BUILD_DESC }}
            BUILD_FROM_IMAGE=${{ env.BUILD_FROM_IMAGE }}
            BUILD_NAME=${{ env.BUILD_NAME }}
            BUILD_PLATFORM=${{ env.BUILD_PLATFORM }}
            BUILD_REVISION=${{ env.BUILD_REVISION }}
            BUILD_SOURCE_IMAGE=${{ env.BUILD_SOURCE_IMAGE }}
            BUILD_TAG_PREFIX=${{ env.BUILD_TAG_PREFIX }}
            BUILD_TAG=${{ env.BUILD_TAG }}
            BUILD_TAGS=${{ env.BUILD_TAGS }}
            LATEST_PHP=${{ env.LATEST_PHP }}
            LATEST_S6=${{ env.LATEST_S6 }}
            OS_BASE=${{ env.OS_BASE }}
            OS_VERSION=${{ env.OS_VERSION }}
            PHP_VARIANT=${{ env.PHP_VARIANT }}
            PHP_VERSION=${{ env.PHP_VERSION }}
            S6_PATH=${{ env.S6_PATH }}
            S6_VERSION=${{ env.S6_VERSION }}

      -
        if: ${{ env.SKIP_SQUASH != '1' }}
        name: Make squashed Dockerfile for ${{ env.BUILD_TAG }}
        continue-on-error: ${{ inputs.continue-on-error }}
        run: |
          docker pull --platform "${{ matrix.platform }}" "${{ env.BUILD_TMP_NAME }}"
          DEBUG= ${{ env.SQUASH_CMD }} "${{ env.BUILD_TMP_NAME }}" -p >"${{ env.BUILD_DOCKERFILE_SQUASHED }}"
          cat "${{ env.BUILD_DOCKERFILE_SQUASHED }}"
          docker images
          df -h

      -
        if: ${{ env.SKIP_SQUASH != '1' }}
        id: push_squash
        name: Squash and push ${{ env.BUILD_TAG }} for ${{ matrix.platform }}
        uses: docker/build-push-action@v7
        continue-on-error: ${{ inputs.continue-on-error }}
        with:
          pull: false
          platforms: ${{ matrix.platform }}
          file: ${{ env.BUILD_DOCKERFILE_SQUASHED }}
          context: ${{ env.BUILD_CONTEXT }}
          outputs: type=image,name=${{ steps.stage.outputs.name }},push-by-digest=true,name-canonical=true,push=${{ env.SKIP_PUSH != '1' }}
          sbom: true
          build-args: |
            DEBUG=${{ env.DEBUG }}

      -
        id: digest
        if: ${{ env.SKIP_PUSH != '1' }}
        name: Save the digest
        env:
          DIGEST: ${{ steps.push_squash.outputs.digest || steps.build.outputs.digest }}
        run: |
          [ -n "$DIGEST" ] || { echo "::error::No digest for ${{ matrix.platform }}"; exit 1; }
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      -
        if: ${{ env.SKIP_PUSH != '1' }}
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ needs.prepare.outputs.fingerprint }}-${{ matrix.slug }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  ##############################################################################

  merge:
    name: ${{ inputs.php_version }} ${{ inputs.app_name }} ${{ inputs.server }} ${{ inputs.os }} (publish)
    needs: [prepare, build]
    if: ${{ needs.prepare.outputs.skip != '1' }}
    runs-on: ubuntu-26.04-arm
    permissions:
      packages: write
      contents: read
    env:
      PUBLISH_TO_GHCR: "1"
    steps:
      -
        uses: actions/checkout@v7
        with:
          submodules: 'true'

      -
        name: Load build config
        env:
          BUILD_ENV: ${{ needs.prepare.outputs.env }}
        run: printf '%s\n' "$BUILD_ENV" >> "$GITHUB_ENV"

      -
        if: ${{ env.SKIP_PUSH != '1' }}
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-${{ needs.prepare.outputs.fingerprint }}-*
          merge-multiple: true

      -
        uses: docker/setup-buildx-action@v4

      -
        uses: ./.github/actions/registry-login
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      -
        if: ${{ env.SKIP_PUSH != '1' }}
        name: Publish ${{ env.BUILD_TAG }}
        continue-on-error: ${{ inputs.continue-on-error }}
        working-directory: /tmp/digests
        run: |
          set -e
          stage="$BUILD_NAME"
          [ "$PUBLISH_TO_GHCR" = "1" ] && stage="ghcr.io/$BUILD_NAME"

          tags=()
          for tag in ${BUILD_TAGS//,/ }; do
              tags+=(-t "$tag")
          done

          sources=()
          for digest in *; do
              sources+=("$stage@sha256:$digest")
          done

          docker buildx imagetools create "${tags[@]}" \
              --annotation "index:org.shinsenter.build.fingerprint=$BUILD_FINGERPRINT" \
              "${sources[@]}"
          docker buildx imagetools inspect "$BUILD_TAG"

      - # Without the fingerprint the next run would build this image again
        if: ${{ success() && env.SKIP_PUSH != '1' }}
        name: Verify the fingerprint of ${{ env.BUILD_TAG }}
        run: |
          set -e
          . ./build/helpers.sh
          published="$(get_image_fingerprint "ghcr.io/${{ env.BUILD_TAG }}")"
          echo "expected  = ${{ env.BUILD_FINGERPRINT }}"
          echo "published = $published"
          if [ "$published" != "${{ env.BUILD_FINGERPRINT }}" ]; then
            echo "::error::The published image does not carry the expected fingerprint"
            exit 1
          fi

      -
        if: ${{ success() && env.BUILD_README != '' && env.UPDATE_README == '1' }}
        name: Update ${{ env.BUILD_NAME }}/README.md
        uses: peter-evans/dockerhub-description@v5
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}
          repository: ${{ env.BUILD_NAME }}
          short-description: '${{ env.BUILD_DESC }}'
          readme-filepath: ${{ env.BUILD_README }}
