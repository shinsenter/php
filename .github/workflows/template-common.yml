################################################################################

name: Build Template

################################################################################
################################################################################

on:
  workflow_call:
    inputs:
      app_name:
        required: true
        type: string
      php_version:
        required: false
        type: string
        default: ""
      server:
        required: false
        type: string
        default: ""
      os:
        required: false
        type: string
        default: alpine
      os_version:
        required: false
        type: string
        default: latest
      tag_prefix:
        required: false
        type: string
        default: ""
      force_build:
        required: false
        type: boolean
        default: false
      continue-on-error:
        required: false
        type: boolean
        default: false
    secrets:
      DOCKER_HUB_ACCESS_TOKEN:
        required: true
      DOCKER_HUB_USERNAME:
        required: true
      DOCKER_HUB_PASSWORD:
        required: true

################################################################################
################################################################################

jobs:
  # Runs build/config.sh once and hands the result to the jobs below.
  # The build runs once per platform on a runner of the same architecture
  # where possible (QEMU is only used for 32-bit ARM),
  # the last platform to finish publishes one multi-platform tag.
  prepare:
    name: ${{ inputs.php_version }} ${{ inputs.app_name }} ${{ inputs.server }} ${{ inputs.os }} (prepare)
    runs-on: ubuntu-26.04-arm
    env:
      ARCHIVES_REPO: "shinsenter/php-archives"
      MIRROR_REPO: ghcr.io/shinsenter
      PUBLISH_TO_GHCR: "1"
    outputs:
      skip: ${{ steps.plan.outputs.skip }}
      matrix: ${{ steps.plan.outputs.matrix }}
      fingerprint: ${{ steps.plan.outputs.fingerprint }}
      env: ${{ steps.plan.outputs.env }}
    steps:
      -
        uses: actions/download-artifact@v8
        with:
          name: helper_cache
          path: /tmp/helper_cache/

      -
        uses: actions/checkout@v7
        with:
          submodules: 'true'

      -
        name: Generate build config
        continue-on-error: ${{ inputs.continue-on-error }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKER_HUB_PASSWORD }}
          BUILD_TAG_PREFIX: ${{ inputs.tag_prefix }}
          FORCE_BUILD: ${{ inputs.force_build && '1' || '0' }}
          BUILD_ENV_FILE: /tmp/build.env
          INPUT_OS: ${{ inputs.os }}
          INPUT_APP_NAME: ${{ inputs.app_name }}
          INPUT_PHP_VERSION: ${{ inputs.php_version }}
          INPUT_SERVER: ${{ inputs.server }}
        run: |
          set -e
          ./build/config.sh "$INPUT_OS" "$INPUT_APP_NAME" "$INPUT_PHP_VERSION" "$INPUT_SERVER"

      -
        id: plan
        name: Plan the platform builds
        run: |
          set -e
          . ./build/helpers.sh
          matrix="$(plan_matrix "$BUILD_PLATFORM")"
          skip="${SKIP_BUILD:-0}"
          if [ "$matrix" = "[]" ]; then
            skip=1
            matrix='[{"platform":"none","slug":"none","runner":"ubuntu-26.04","qemu":""}]'
          fi
          {
            echo "skip=$skip"
            echo "matrix=$matrix"
            echo "fingerprint=$BUILD_FINGERPRINT"
            echo "env<<EOF_BUILD_ENV"
            cat /tmp/build.env 2>/dev/null || true
            echo "EOF_BUILD_ENV"
          } >> "$GITHUB_OUTPUT"
          echo "skip=$skip matrix=$matrix"

  ##############################################################################

  build:
    name: ${{ inputs.php_version }} ${{ inputs.app_name }} ${{ inputs.server }} ${{ inputs.os }} ${{ matrix.platform }}
    needs: prepare
    if: ${{ needs.prepare.outputs.skip != '1' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    permissions:
      packages: write
      contents: read
      id-token: write
    services:
      registry:
        image: registry:2
        ports:
          - '5000:5000'
    env:
      DOCKER_BUILD_RECORD_UPLOAD: false
      DOCKER_BUILD_SUMMARY: false
      DOCKER_BUILDKIT: "1"
      PUBLISH_TO_GHCR: "1"
    steps:
      -
        uses: actions/checkout@v7
        with:
          submodules: 'true'

      -
        name: Load build config
        env:
          BUILD_ENV: ${{ needs.prepare.outputs.env }}
        run: printf '%s\n' "$BUILD_ENV" >> "$GITHUB_ENV"

      -
        name: Prepare build context
        run: |
          set -e
          BASE_DIR="$(git rev-parse --show-toplevel)"
          . ./build/helpers.sh
          prepare_build_context "$BUILD_DOCKERFILE" "$BUILD_CONTEXT" "$PHP_VERSION"

      - # brotli and curl sources for common/patches/middleware-patch
        uses: actions/download-artifact@v8
        with:
          name: helper_cache
          path: ${{ env.BUILD_CONTEXT }}/helper_cache/

      -
        if: ${{ matrix.qemu != '' }}
        uses: docker/setup-qemu-action@v4
        with:
          platforms: ${{ matrix.qemu }}

      -
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host

      -
        uses: ./.github/actions/registry-login
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - # Each platform is pushed by digest, the last platform puts the digests under the tags
        id: stage
        name: Set the staging repository
        run: |
          if [ "$PUBLISH_TO_GHCR" = "1" ]; then
            echo "name=ghcr.io/$BUILD_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "name=$BUILD_NAME" >> "$GITHUB_OUTPUT"
          fi

      - # Squash mode builds a temporary image first, the squashed one is pushed below
        id: build
        name: Build ${{ env.BUILD_TAG }} for ${{ matrix.platform }}
        uses: docker/build-push-action@v7
        continue-on-error: ${{ inputs.continue-on-error }}
        with:
          pull: false
          push: ${{ env.SKIP_SQUASH != '1' }}
          platforms: ${{ matrix.platform }}
          file: ${{ env.BUILD_DOCKERFILE }}
          context: ${{ env.BUILD_CONTEXT }}
          tags: ${{ env.SKIP_SQUASH != '1' && env.BUILD_TMP_NAME || '' }}
          outputs: ${{ env.SKIP_SQUASH == '1' && format('type=image,name={0},push-by-digest=true,name-canonical=true,compression=zstd,force-compression=true,oci-mediatypes=true,push={1}', steps.stage.outputs.name, env.SKIP_PUSH != '1') || '' }}
          # the temporary image of squash mode is discarded, only the final image needs an SBOM
          sbom: ${{ env.SKIP_SQUASH == '1' }}
          provenance: ${{ env.SKIP_SQUASH == '1' && 'mode=max' || 'false' }}
          build-args: |
            DEBUG=${{ env.DEBUG }}
            BUILD_CACHE_KEY=${{ env.BUILD_CACHE_KEY }}
            BUILD_CONTEXT=${{ env.BUILD_CONTEXT }}
            BUILD_DATE=${{ env.BUILD_DATE }}
            BUILD_DESC=${{ env.BUILD_DESC }}
            BUILD_FROM_IMAGE=${{ env.BUILD_FROM_IMAGE }}
            BUILD_NAME=${{ env.BUILD_NAME }}
            BUILD_PLATFORM=${{ env.BUILD_PLATFORM }}
            BUILD_REVISION=${{ env.BUILD_REVISION }}
            BUILD_SOURCE_IMAGE=${{ env.BUILD_SOURCE_IMAGE }}
            BUILD_TAG_PREFIX=${{ env.BUILD_TAG_PREFIX }}
            BUILD_TAG=${{ env.BUILD_TAG }}
            BUILD_TAGS=${{ env.BUILD_TAGS }}
            LATEST_PHP=${{ env.LATEST_PHP }}
            LATEST_S6=${{ env.LATEST_S6 }}
            APACHE_VERSION=${{ env.APACHE_VERSION }}
            NGINX_VERSION=${{ env.NGINX_VERSION }}
            OS_BASE=${{ env.OS_BASE }}
            OS_VERSION=${{ env.OS_VERSION }}
            PHP_VARIANT=${{ env.PHP_VARIANT }}
            PHP_VERSION=${{ env.PHP_VERSION }}
            S6_PATH=${{ env.S6_PATH }}
            S6_VERSION=${{ env.S6_VERSION }}

      -
        if: ${{ env.SKIP_SQUASH != '1' }}
        name: Make squashed Dockerfile for ${{ env.BUILD_TAG }}
        continue-on-error: ${{ inputs.continue-on-error }}
        env:
          MATRIX_PLATFORM: ${{ matrix.platform }}
        run: |
          docker pull --platform "$MATRIX_PLATFORM" "$BUILD_TMP_NAME"
          DEBUG= $SQUASH_CMD "$BUILD_TMP_NAME" -p >"$BUILD_DOCKERFILE_SQUASHED"
          cat "$BUILD_DOCKERFILE_SQUASHED"
          docker images
          df -h

      - # Only the pushed image uses zstd layers (smaller, faster pull), the temporary image above stays gzip
        if: ${{ env.SKIP_SQUASH != '1' }}
        id: push_squash
        name: Squash and push ${{ env.BUILD_TAG }} for ${{ matrix.platform }}
        uses: docker/build-push-action@v7
        continue-on-error: ${{ inputs.continue-on-error }}
        with:
          pull: false
          platforms: ${{ matrix.platform }}
          file: ${{ env.BUILD_DOCKERFILE_SQUASHED }}
          context: ${{ env.BUILD_CONTEXT }}
          outputs: type=image,name=${{ steps.stage.outputs.name }},push-by-digest=true,name-canonical=true,compression=zstd,force-compression=true,oci-mediatypes=true,push=${{ env.SKIP_PUSH != '1' }}
          sbom: true
          provenance: mode=max
          build-args: |
            DEBUG=${{ env.DEBUG }}

      -
        id: digest
        if: ${{ env.SKIP_PUSH != '1' }}
        name: Save the digest
        env:
          DIGEST: ${{ steps.push_squash.outputs.digest || steps.build.outputs.digest }}
        run: |
          [ -n "$DIGEST" ] || { echo "::error::No digest for ${{ matrix.platform }}"; exit 1; }
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      -
        if: ${{ env.SKIP_PUSH != '1' }}
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ needs.prepare.outputs.fingerprint }}-${{ matrix.slug }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

      - # The platform that finishes last sees every digest and publishes the tags itself, so no job waits for a runner again
        if: ${{ env.SKIP_PUSH != '1' }}
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-${{ needs.prepare.outputs.fingerprint }}-*
          merge-multiple: true

      -
        id: gather
        if: ${{ env.SKIP_PUSH != '1' }}
        name: Check whether every platform is done
        env:
          EXPECTED: ${{ strategy.job-total }}
        run: |
          count="$(find /tmp/digests -type f | wc -l)"
          echo "digests = $count of $EXPECTED"
          if [ "$count" -ge "$EXPECTED" ]; then echo "ready=1" >> "$GITHUB_OUTPUT"; fi

      -
        if: ${{ steps.gather.outputs.ready == '1' }}
        uses: ./.github/actions/publish
        with:
          continue-on-error: ${{ inputs.continue-on-error }}

  ##############################################################################

  readme:
    name: ${{ inputs.php_version }} ${{ inputs.app_name }} ${{ inputs.server }} ${{ inputs.os }} (readme)
    needs: [prepare, build]
    # Runs even when build is skipped (SKIP_BUILD), but not after a failure
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.build.result != 'failure' }}
    runs-on: ubuntu-26.04-arm
    steps:
      -
        uses: actions/checkout@v7

      -
        name: Load build config
        env:
          BUILD_ENV: ${{ needs.prepare.outputs.env }}
        run: printf '%s\n' "$BUILD_ENV" >> "$GITHUB_ENV"

      -
        if: ${{ env.BUILD_README != '' && env.UPDATE_README == '1' }}
        name: Update ${{ env.BUILD_NAME }}/README.md
        uses: peter-evans/dockerhub-description@v5
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}
          repository: ${{ env.BUILD_NAME }}
          short-description: '${{ env.BUILD_DESC }}'
          readme-filepath: ${{ env.BUILD_README }}
