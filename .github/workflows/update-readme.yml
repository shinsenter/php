name: Update README of inactive apps

################################################################################
################################################################################

# The images in src/webapps/zz-* are no longer built, so the build workflows
# never refresh their Docker Hub pages. Run this by hand after changing one of
# their README.md files. It uses the same action and the same short description
# (line 3 of the README) as the build workflows.

on:
  workflow_dispatch:
    inputs:
      apps:
        description: "Comma-separated app names without the zz- prefix (empty for all)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  prepare:
    name: List apps
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      -
        uses: actions/checkout@v7

      -
        id: list
        env:
          APPS: ${{ inputs.apps }}
        run: |
          set -e
          cd src/webapps
          if [ -z "$APPS" ]; then
              apps=$(ls -d zz-*/ | sed 's~^zz-~~; s~/$~~')
          else
              apps=$(printf '%s' "$APPS" | tr ',' '\n' | sed 's/^ *//; s/ *$//' | grep -v '^$')
          fi
          for app in $apps; do
              [ -f "zz-$app/README.md" ] || { echo "::error::src/webapps/zz-$app/README.md not found"; exit 1; }
          done
          echo "matrix=$(printf '%s\n' $apps | jq -R . | jq -sc .)" >>"$GITHUB_OUTPUT"

  update:
    name: ${{ matrix.app }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      -
        uses: actions/checkout@v7

      -
        id: readme
        run: |
          echo "desc=$(sed '3q;d' "src/webapps/zz-${{ matrix.app }}/README.md")" >>"$GITHUB_OUTPUT"

      -
        name: Update shinsenter/${{ matrix.app }}/README.md
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}
          repository: shinsenter/${{ matrix.app }}
          short-description: '${{ steps.readme.outputs.desc }}'
          readme-filepath: src/webapps/zz-${{ matrix.app }}/README.md
