name: Build all

################################################################################
################################################################################

# There is no scheduled run any more. The "Watch updates" workflow checks the
# upstream sources and starts this workflow only for the PHP versions that need
# a new build. Every image also compares its own fingerprint with the published
# one and skips the build when nothing changed.

on:
  workflow_dispatch:
    inputs:
      php_versions:
        description: "PHP versions to build, separated by spaces (empty = all versions and the base-os and base-s6 images)"
        required: false
        type: string
        default: ""
      force_build:
        description: "Build even when the published image is up to date"
        required: false
        type: boolean
        default: false
  release:
    types: [released]
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'build/**'
      - '!src/**.md'
  pull_request:
    types: [opened]
    paths:
      - 'src/**'
      - '!src/**.md'

concurrency:
  group: build-all-${{ github.ref }}
  cancel-in-progress: false

################################################################################
################################################################################

jobs:
  prepare:
    runs-on: ubuntu-26.04-arm
    outputs:
      tag_prefix: ${{ steps.init.outputs.tag_prefix }}
      php_versions: ${{ steps.init.outputs.php_versions }}
      force_build: ${{ steps.init.outputs.force_build }}
      build_base: ${{ steps.init.outputs.build_base }}
    steps:
      - uses: actions/checkout@v7

      - name: pre-build debug
        id: init
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKER_HUB_PASSWORD }}
          REQUESTED_VERSIONS: ${{ inputs.php_versions }}
          FORCE_BUILD: ${{ inputs.force_build }}
        run: |
          set -e
          . ./build/helpers.sh
          . ./build/versions.sh

          # Prepare variables
          ref_type=${{ github.ref_type }}
          ref=${{ github.ref }}
          tag_prefix=$(if [[ $ref_type != 'tag' ]] && [[ $ref != 'refs/heads/main' ]]; then echo 'dev-'; fi)
          force_build=$(if [ "$FORCE_BUILD" = "true" ]; then echo 'true'; else echo 'false'; fi)

          # Select PHP versions: the requested ones, or all of them
          # base-os and base-s6 are built only when no PHP version is requested
          php_versions=()
          build_base=true
          if [ -n "${REQUESTED_VERSIONS// /}" ]; then
            build_base=false
            for requested in ${REQUESTED_VERSIONS//,/ }; do
              found=
              for version in "${ALL_PHP_VERSIONS[@]}"; do
                if [ "$version" = "$requested" ] || [ "${version%-rc}" = "$requested" ]; then
                  php_versions+=("$version")
                  found=1
                fi
              done
              if [ -z "$found" ]; then
                echo "Unknown PHP version: $requested" >&2
                exit 1
              fi
            done
          else
            php_versions=("${ALL_PHP_VERSIONS[@]}")
          fi
          php_versions_json=$(printf '%s\n' "${php_versions[@]}" | jq -R . | jq -sc .)

          # For debugging purposes
          echo "tag_prefix=$tag_prefix" >> "$GITHUB_OUTPUT"
          echo "php_versions=$php_versions_json" >> "$GITHUB_OUTPUT"
          echo "force_build=$force_build" >> "$GITHUB_OUTPUT"
          echo "build_base=$build_base" >> "$GITHUB_OUTPUT"
          echo "number_of_cores   = $(nproc)"
          echo "github.event_name = ${{ github.event_name }}"
          echo "github.ref_type   = $ref_type"
          echo "github.ref        = $ref"
          echo "tag_prefix        = $tag_prefix"
          echo "php_versions      = $php_versions_json"
          echo "force_build       = $force_build"
          echo "build_base        = $build_base"

          # Cache requests (shared by all jobs of this run)
          echo "Generating cache keys..."
          get_github_latest_tag "composer/composer"
          get_github_latest_tag "just-containers/s6-overlay"
          get_github_latest_tag "mlocati/docker-php-extension-installer"
          get_github_latest_tag "roadrunner-server/roadrunner"

          distros=(debian alpine)
          variants=(cli fpm zts)

          get_sha() {
            get_dockerhub_tag_digest "$@" >/dev/null || true
          }

          for distro in "${distros[@]}"; do
            get_sha "library/$distro" latest
            if [ "$distro" == "debian" ]; then
              distro=""
            fi
            for version in "${php_versions[@]}"; do
              for variant in "${variants[@]}"; do
                get_sha "library/php" "${version}-${variant}${distro:+-$distro}"
                if [ "$variant" == "zts" ] && verlte "8.2" "$version"; then
                  get_sha "dunglas/frankenphp" "1-php${version}${distro:+-$distro}"
                fi
              done
            done
          done
          get_sha "library/ubuntu" latest

      - uses: actions/upload-artifact@v7
        with:
          name: helper_cache
          overwrite: true
          path: /tmp/helper_cache/

  ##########################################################

  s6-overlay:
    if: ${{ needs.prepare.outputs.build_base == 'true' }}
    uses: ./.github/workflows/template-common.yml
    secrets: inherit
    needs: [prepare]
    with:
      app_name: "base-s6"
      os: "alpine"
      tag_prefix: ${{ needs.prepare.outputs.tag_prefix }}
      force_build: ${{ fromJSON(needs.prepare.outputs.force_build) }}

  linux-s6:
    name: ${{ matrix.os == '' && 'debian' || matrix.os }}-s6
    if: ${{ needs.prepare.outputs.build_base == 'true' }}
    uses: ./.github/workflows/template-common.yml
    secrets: inherit
    needs: [prepare]
    strategy:
      fail-fast: false
      matrix:
        os:
          - ""
          - "ubuntu"
          - "alpine"
    with:
      app_name: "base-os"
      os: ${{ matrix.os }}
      tag_prefix: ${{ needs.prepare.outputs.tag_prefix }}
      force_build: ${{ fromJSON(needs.prepare.outputs.force_build) }}

  ##########################################################

  php-fpm:
    uses: ./.github/workflows/template-php.yml
    secrets: inherit
    needs: [prepare]
    strategy:
      fail-fast: false
      matrix:
        app:
          - fpm
    with:
      app_name: ${{ matrix.app }}
      tag_prefix: ${{ needs.prepare.outputs.tag_prefix }}
      php_versions: ${{ needs.prepare.outputs.php_versions }}
      force_build: ${{ fromJSON(needs.prepare.outputs.force_build) }}

  php-cli:
    uses: ./.github/workflows/template-php.yml
    secrets: inherit
    needs: [prepare]
    strategy:
      fail-fast: false
      matrix:
        app:
          - cli
    with:
      app_name: ${{ matrix.app }}
      tag_prefix: ${{ needs.prepare.outputs.tag_prefix }}
      php_versions: ${{ needs.prepare.outputs.php_versions }}
      force_build: ${{ fromJSON(needs.prepare.outputs.force_build) }}

  php-zts:
    uses: ./.github/workflows/template-php.yml
    secrets: inherit
    needs: [prepare]
    strategy:
      fail-fast: false
      matrix:
        app:
          - zts
    with:
      app_name: ${{ matrix.app }}
      tag_prefix: ${{ needs.prepare.outputs.tag_prefix }}
      php_versions: ${{ needs.prepare.outputs.php_versions }}
      force_build: ${{ fromJSON(needs.prepare.outputs.force_build) }}

  ##########################################################

  fpm-servers:
    uses: ./.github/workflows/template-php.yml
    secrets: inherit
    needs: [prepare, php-fpm]
    strategy:
      fail-fast: false
      matrix:
        app:
          - with-apache
          - with-nginx
    with:
      app_name: ${{ matrix.app }}
      tag_prefix: ${{ needs.prepare.outputs.tag_prefix }}
      php_versions: ${{ needs.prepare.outputs.php_versions }}
      force_build: ${{ fromJSON(needs.prepare.outputs.force_build) }}

  zts-servers:
    uses: ./.github/workflows/template-php.yml
    secrets: inherit
    needs: [prepare, php-zts]
    strategy:
      fail-fast: false
      matrix:
        app:
          - with-f8p
    with:
      app_name: ${{ matrix.app }}
      tag_prefix: ${{ needs.prepare.outputs.tag_prefix }}
      php_versions: ${{ needs.prepare.outputs.php_versions }}
      force_build: ${{ fromJSON(needs.prepare.outputs.force_build) }}

  cli-servers:
    uses: ./.github/workflows/template-php.yml
    secrets: inherit
    needs: [prepare, php-cli]
    strategy:
      fail-fast: false
      matrix:
        app:
          - with-roadrunner
    with:
      app_name: ${{ matrix.app }}
      tag_prefix: ${{ needs.prepare.outputs.tag_prefix }}
      php_versions: ${{ needs.prepare.outputs.php_versions }}
      force_build: ${{ fromJSON(needs.prepare.outputs.force_build) }}

  ##########################################################

  server-cache:
    runs-on: ubuntu-26.04-arm
    needs: [prepare, cli-servers, fpm-servers]
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: helper_cache
          path: /tmp/helper_cache/

      - uses: actions/checkout@v7

      - name: Prepare cache
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKER_HUB_PASSWORD }}
        run: |
          set -e
          . ./build/helpers.sh
          tag_prefix="${{ needs.prepare.outputs.tag_prefix }}"
          php_versions=($(echo '${{ needs.prepare.outputs.php_versions }}' | jq -r '.[]'))
          distros=(debian alpine)
          # laravel is not listed: it is built after this job, its digest is fetched later
          base_images=(phpfpm-nginx phpfpm-apache roadrunner)

          get_sha() {
            get_dockerhub_tag_digest "$@" >/dev/null || true
          }

          # Digests of the images that were just published (used by the app builds)
          for distro in "${distros[@]}"; do
            if [ "$distro" == "debian" ]; then
              distro=""
            fi
            for version in "${php_versions[@]}"; do
              if verlt "7.1" "$version" || [ "$distro" = "" ]; then
                for base in "${base_images[@]}"; do
                  get_sha "shinsenter/$base" "${tag_prefix}php${version//-rc/}${distro:+-$distro}"
                done
              fi
            done
          done

          ls -lh /tmp/helper_cache/ | awk '{ if(NR>1) printf "%10s  %s\n", $5, $9 }'

      - uses: actions/upload-artifact@v7
        with:
          name: helper_cache
          overwrite: true
          path: /tmp/helper_cache/

  ##########################################################

  popular-apps:
    name: ${{ matrix.app }}
    uses: ./.github/workflows/template-php.yml
    secrets: inherit
    needs: [prepare, server-cache]
    strategy:
      fail-fast: false
      matrix:
        app:
          - app-cakephp4
          - app-cakephp5
          - app-codeigniter4
          - app-drupal
          - app-espocrm
          - app-flarum
          - app-flightphp
          - app-grav
          - app-hyperf
          - app-kirby
          - app-laminas
          - app-laravel
          - app-magento
          - app-matomo
          - app-mautic
          - app-phpmyadmin
          - app-slim
          - app-symfony
          - app-wordpress
          - app-yii
        server:
          - ""
        # include:
        #   - app: app-laravel
        #     server: apache
        #   - app: app-laravel
        #     server: nginx
    with:
      app_name: ${{ matrix.app }}
      server: ${{ matrix.server }}
      tag_prefix: ${{ needs.prepare.outputs.tag_prefix }}
      php_versions: ${{ needs.prepare.outputs.php_versions }}
      force_build: ${{ fromJSON(needs.prepare.outputs.force_build) }}

  other-apps:
    name: ${{ matrix.app }}
    uses: ./.github/workflows/template-php.yml
    secrets: inherit
    needs: [prepare, server-cache]
    strategy:
      fail-fast: false
      matrix:
        app:
          - app-spiral
    with:
      app_name: ${{ matrix.app }}
      tag_prefix: ${{ needs.prepare.outputs.tag_prefix }}
      php_versions: ${{ needs.prepare.outputs.php_versions }}
      force_build: ${{ fromJSON(needs.prepare.outputs.force_build) }}

  extended-apps:
    name: ${{ matrix.app }}
    uses: ./.github/workflows/template-php.yml
    secrets: inherit
    needs: [prepare, popular-apps]
    strategy:
      fail-fast: false
      matrix:
        app:
          - app-bagisto
          - app-bedrock
          - app-coolify
          - app-hypervel
          - app-invoiceshelf
          - app-statamic
          - app-sulu
    with:
      app_name: ${{ matrix.app }}
      tag_prefix: ${{ needs.prepare.outputs.tag_prefix }}
      php_versions: ${{ needs.prepare.outputs.php_versions }}
      force_build: ${{ fromJSON(needs.prepare.outputs.force_build) }}

################################################################################
################################################################################
