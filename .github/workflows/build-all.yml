name: Build all

################################################################################
################################################################################

# There is no scheduled run any more.
# The "Watch updates" workflow checks the upstream sources
# and starts this workflow only for the PHP versions that need a new build.
# Every image also compares its own fingerprint with the published one and skips the build
# when nothing changed.
#
# Jobs (each one calls template-stack.yml, template-php.yml or template-common.yml)
#  prepare                                 selects the PHP versions and fills the helper cache
#  s6-overlay, linux-s6                    base images, only when no PHP version is requested
#  fpm, cli, zts                           a PHP variant, then the servers built on top of it
#  server-cache                            digests of the published servers, for the apps
#  popular-apps, other-apps, extended-apps web applications on top of the servers

on:
  workflow_dispatch:
    inputs:
      php_versions:
        description: "PHP versions to build, separated by spaces (empty = all versions and the base-os and base-s6 images)"
        required: false
        type: string
        default: ""
      force_build:
        description: "Build even when the published image is up to date"
        required: false
        type: boolean
        default: false
  release:
    types: [released]
  push:
    branches: [main]
    # Markdown files are not part of the fingerprint.
    # A change there skips the build and only refreshes the Docker Hub README.
    paths:
      - 'src/**'
      - 'build/**'
      - 'README.md'
  pull_request:
    types: [opened]
    paths:
      - 'src/**'
      - '!src/**.md'

concurrency:
  group: build-all-${{ github.ref }}
  cancel-in-progress: false

# A reusable workflow cannot get more than its caller grants.
# The jobs that call one grant packages (GHCR) and id-token (keyless signature with cosign) themselves.
permissions:
  contents: read

################################################################################
################################################################################

jobs:
  prepare:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 20
    outputs:
      tag_prefix: ${{ steps.init.outputs.tag_prefix }}
      php_versions: ${{ steps.init.outputs.php_versions }}
      force_build: ${{ steps.init.outputs.force_build }}
      build_base: ${{ steps.init.outputs.build_base }}
    steps:
      - uses: actions/checkout@v7

      - name: Select the PHP versions and fill the helper cache
        id: init
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKER_HUB_PASSWORD }}
          REQUESTED_VERSIONS: ${{ inputs.php_versions }}
          FORCE_BUILD: ${{ inputs.force_build }}
        run: |
          set -e
          . ./build/helpers.sh
          . ./build/versions.sh

          # Images of a branch other than main get the dev- tag prefix
          tag_prefix=
          if [ "$GITHUB_REF_TYPE" != 'tag' ] && [ "$GITHUB_REF" != 'refs/heads/main' ]; then tag_prefix='dev-'; fi
          force_build=false
          if [ "$FORCE_BUILD" = "true" ]; then force_build=true; fi

          # Select the PHP versions: the requested ones, or all of them.
          # base-os and base-s6 are built only when no PHP version is requested.
          version_lines="$(select_php_versions "$REQUESTED_VERSIONS")"
          mapfile -t php_versions <<< "$version_lines"
          php_versions_json=$(printf '%s\n' "${php_versions[@]}" | jq -R . | jq -sc .)
          build_base=true
          if [ -n "${REQUESTED_VERSIONS// /}" ]; then build_base=false; fi

          # Outputs for the next jobs, and a summary in the log
          {
            echo "tag_prefix=$tag_prefix"
            echo "php_versions=$php_versions_json"
            echo "force_build=$force_build"
            echo "build_base=$build_base"
          } | tee -a "$GITHUB_OUTPUT"
          echo "github.event_name=${{ github.event_name }} github.ref=$GITHUB_REF cores=$(nproc)"

          # Lookups shared by all jobs of this run (uploaded below as the helper_cache artifact)
          cache_run_inputs "${php_versions[@]}"

      - # The source archives, for the build jobs
        uses: actions/upload-artifact@v7
        with:
          name: helper_cache
          overwrite: true
          path: |
            /tmp/helper_cache/
            !/tmp/helper_cache/*.cache
            !/tmp/helper_cache/ipe-supported-extensions

      - # The small lookups, for the prepare jobs
        uses: actions/upload-artifact@v7
        with:
          name: helper_lookups
          overwrite: true
          path: |
            /tmp/helper_cache/*.cache
            /tmp/helper_cache/ipe-supported-extensions

  ##########################################################

  s6-overlay:
    if: ${{ needs.prepare.outputs.build_base == 'true' }}
    uses: ./.github/workflows/template-common.yml
    permissions:
      contents: read
      packages: write
      id-token: write
    secrets: inherit
    needs: [prepare]
    with:
      app_name: "base-s6"
      os: "alpine"
      tag_prefix: ${{ needs.prepare.outputs.tag_prefix }}
      force_build: ${{ fromJSON(needs.prepare.outputs.force_build) }}

  linux-s6:
    name: ${{ matrix.os == '' && 'debian' || matrix.os }}-s6
    if: ${{ needs.prepare.outputs.build_base == 'true' }}
    uses: ./.github/workflows/template-common.yml
    permissions:
      contents: read
      packages: write
      id-token: write
    secrets: inherit
    needs: [prepare]
    strategy:
      fail-fast: false
      matrix:
        os:
          - ""
          - "ubuntu"
          - "alpine"
    with:
      app_name: "base-os"
      os: ${{ matrix.os }}
      tag_prefix: ${{ needs.prepare.outputs.tag_prefix }}
      force_build: ${{ fromJSON(needs.prepare.outputs.force_build) }}

  ##########################################################

  # A PHP variant, then the servers built on top of it
  fpm:
    uses: ./.github/workflows/template-stack.yml
    permissions:
      contents: read
      packages: write
      id-token: write
    secrets: inherit
    needs: [prepare]
    with:
      base: fpm
      servers: '["with-apache","with-nginx"]'
      tag_prefix: ${{ needs.prepare.outputs.tag_prefix }}
      php_versions: ${{ needs.prepare.outputs.php_versions }}
      force_build: ${{ fromJSON(needs.prepare.outputs.force_build) }}

  cli:
    uses: ./.github/workflows/template-stack.yml
    permissions:
      contents: read
      packages: write
      id-token: write
    secrets: inherit
    needs: [prepare]
    with:
      base: cli
      servers: '["with-roadrunner"]'
      tag_prefix: ${{ needs.prepare.outputs.tag_prefix }}
      php_versions: ${{ needs.prepare.outputs.php_versions }}
      force_build: ${{ fromJSON(needs.prepare.outputs.force_build) }}

  zts:
    uses: ./.github/workflows/template-stack.yml
    permissions:
      contents: read
      packages: write
      id-token: write
    secrets: inherit
    needs: [prepare]
    with:
      base: zts
      servers: '["with-f8p"]'
      tag_prefix: ${{ needs.prepare.outputs.tag_prefix }}
      php_versions: ${{ needs.prepare.outputs.php_versions }}
      force_build: ${{ fromJSON(needs.prepare.outputs.force_build) }}

  ##########################################################

  server-cache:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 20
    needs: [prepare, cli, fpm]
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: helper_lookups
          path: /tmp/helper_cache/

      - uses: actions/checkout@v7

      - name: Prepare cache
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKER_HUB_PASSWORD }}
          PREPARED_TAG_PREFIX: ${{ needs.prepare.outputs.tag_prefix }}
          PREPARED_PHP_VERSIONS: ${{ needs.prepare.outputs.php_versions }}
        run: |
          set -e
          . ./build/helpers.sh
          mapfile -t php_versions < <(jq -r '.[]' <<< "$PREPARED_PHP_VERSIONS")
          cache_server_digests "$PREPARED_TAG_PREFIX" "${php_versions[@]}"
          ls -lh /tmp/helper_cache/ | awk '{ if(NR>1) printf "%10s  %s\n", $5, $9 }'

      - uses: actions/upload-artifact@v7
        with:
          name: helper_lookups
          overwrite: true
          path: |
            /tmp/helper_cache/*.cache
            /tmp/helper_cache/ipe-supported-extensions

  ##########################################################

  popular-apps:
    name: ${{ matrix.app }}
    uses: ./.github/workflows/template-php.yml
    permissions:
      contents: read
      packages: write
      id-token: write
    secrets: inherit
    needs: [prepare, server-cache]
    strategy:
      fail-fast: false
      matrix:
        app:
          - app-cakephp5
          - app-codeigniter4
          - app-drupal
          - app-espocrm
          - app-flarum
          - app-flightphp
          - app-grav
          - app-hyperf
          - app-kirby
          - app-laravel
          - app-magento
          - app-matomo
          - app-mautic
          - app-phpmyadmin
          - app-symfony
          - app-wordpress
          - app-yii
        server:
          - ""
        # include:
        #   - app: app-laravel
        #     server: apache
        #   - app: app-laravel
        #     server: nginx
    with:
      app_name: ${{ matrix.app }}
      server: ${{ matrix.server }}
      tag_prefix: ${{ needs.prepare.outputs.tag_prefix }}
      php_versions: ${{ needs.prepare.outputs.php_versions }}
      force_build: ${{ fromJSON(needs.prepare.outputs.force_build) }}

  other-apps:
    name: ${{ matrix.app }}
    uses: ./.github/workflows/template-php.yml
    permissions:
      contents: read
      packages: write
      id-token: write
    secrets: inherit
    needs: [prepare, server-cache]
    strategy:
      fail-fast: false
      matrix:
        app:
          - app-spiral
    with:
      app_name: ${{ matrix.app }}
      tag_prefix: ${{ needs.prepare.outputs.tag_prefix }}
      php_versions: ${{ needs.prepare.outputs.php_versions }}
      force_build: ${{ fromJSON(needs.prepare.outputs.force_build) }}

  extended-apps:
    name: ${{ matrix.app }}
    uses: ./.github/workflows/template-php.yml
    permissions:
      contents: read
      packages: write
      id-token: write
    secrets: inherit
    needs: [prepare, popular-apps]
    strategy:
      fail-fast: false
      matrix:
        app:
          - app-bagisto
          - app-bedrock
          - app-coolify
          - app-craftcms
          - app-invoiceshelf
          - app-joomla
          - app-nextcloud
          - app-prestashop
          - app-shopware
          - app-statamic
          - app-sulu
          - app-tempest
    with:
      app_name: ${{ matrix.app }}
      tag_prefix: ${{ needs.prepare.outputs.tag_prefix }}
      php_versions: ${{ needs.prepare.outputs.php_versions }}
      force_build: ${{ fromJSON(needs.prepare.outputs.force_build) }}

################################################################################
################################################################################

  ##########################################################

  # One Trivy scan for every image published in this run (the publish action records them).
  # It downloads Trivy and its database once. It only reports, so a failure here never fails the run.
  scan:
    name: Trivy scan
    needs: [s6-overlay, linux-s6, fpm, cli, zts, popular-apps, other-apps, extended-apps]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Get the list of published images
        id: list
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: scan-*
          path: /tmp/scan
          merge-multiple: false

      - name: Scan the images
        continue-on-error: true
        run: |
          cat /tmp/scan/*/image 2>/dev/null | sort -u > /tmp/scan-list
          ./build/scan-images.sh /tmp/scan-list
