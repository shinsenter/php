name: Watch updates

################################################################################
################################################################################

# Compare the published images with their inputs every 10 minutes (registry manifests only).
# Start "Build all" for the PHP versions that changed.
# Composer, IPE and s6-overlay rebuild the maintained versions only.
# Outdated versions rebuild when their own PHP image changes.
# Finished runs older than 7 days are deleted ("keep_days", 0 = all), release runs are kept.

on:
  schedule:
    # Every 10 minutes, off-peak: GitHub delays or drops runs queued at :00 and :30.
    # Lost runs are covered by the short period, and overlaps queue behind the concurrency group.
    - cron: "5-59/10 * * * *"
  workflow_dispatch:
    inputs:
      keep_days:
        description: "Keep finished runs of the last N days. 0 deletes all finished runs. Default 7"
        type: string
        default: "7"

permissions:
  contents: read
  actions: write

concurrency:
  group: watch-updates
  cancel-in-progress: false

################################################################################
################################################################################

jobs:
  watch:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # The logic lives in build/check-updates.sh, so it can be read and run outside of the workflow
      - name: Check published images
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKER_HUB_PASSWORD }}
        id: check
        run: ./build/check-updates.sh

      - name: Start build
        if: ${{ steps.check.outputs.versions != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSIONS: ${{ steps.check.outputs.versions }}
        run: ./build/check-updates.sh start "$VERSIONS"

      - name: Delete old runs
        if: ${{ always() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP_DAYS: ${{ inputs.keep_days }}
        run: ./build/check-updates.sh cleanup "$KEEP_DAYS"
