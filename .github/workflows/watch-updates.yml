name: Watch updates

################################################################################
################################################################################

# Replaces the old daily build.
# Every 10 minutes this workflow compares the published images with their current inputs
# (official PHP images, Composer, IPE, s6-overlay, FrankenPHP, RoadRunner,
# base OS images and the sources in this repository). It reads registry manifests only.
# When something changed, it starts "Build all" for the affected PHP versions.
#
# Composer, IPE and s6-overlay updates rebuild the maintained versions only.
# Outdated versions are rebuilt when their own official PHP image changes.
#
# It also deletes finished runs older than 7 days. Runs started by a release are kept.
# A manual run can set "keep_days"; 0 deletes all finished runs.

on:
  schedule:
    # Every 10 minutes, off-peak: GitHub delays or drops runs queued at :00 and :30.
    # Some runs are still lost, so a short period keeps the gap small. Overlaps queue
    # behind the concurrency group.
    - cron: "5-59/10 * * * *"
  workflow_dispatch:
    inputs:
      keep_days:
        description: "Keep finished runs of the last N days. 0 deletes all finished runs. Default 7"
        type: string
        default: "7"

permissions:
  contents: read
  actions: write

concurrency:
  group: watch-updates
  cancel-in-progress: false

################################################################################
################################################################################

jobs:
  watch:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7

      # The logic lives in build/check-updates.sh, so it can be read and run outside of the workflow
      - name: Check published images
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKER_HUB_PASSWORD }}
        id: check
        run: ./build/check-updates.sh

      - name: Start build
        if: ${{ steps.check.outputs.versions != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSIONS: ${{ steps.check.outputs.versions }}
        run: ./build/check-updates.sh start "$VERSIONS"

      - name: Delete old runs
        if: ${{ always() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP_DAYS: ${{ inputs.keep_days }}
        run: ./build/check-updates.sh cleanup "$KEEP_DAYS"
