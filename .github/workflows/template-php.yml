name: Build Template PHP

################################################################################
################################################################################

on:
  workflow_call:
    inputs:
      app_name:
        required: true
        type: string
      server:
        required: false
        type: string
        default: ""
      tag_prefix:
        required: false
        type: string
        default: ""
      php_versions:
        description: "JSON array of PHP versions to build (the lists live in build/versions.sh)"
        required: true
        type: string
      force_build:
        required: false
        type: boolean
        default: false

################################################################################
################################################################################

jobs:
  build:
    name: ${{ matrix.php_version }} ${{ matrix.os == '' && 'debian' || matrix.os }}
    uses: ./.github/workflows/template-common.yml
    secrets: inherit
    strategy:
      fail-fast: false
      matrix:
        php_version: ${{ fromJSON(inputs.php_versions) }}
        os: ["", "alpine"]
        exclude:
          - os: "alpine"
            php_version: "5.6"
          - os: "alpine"
            php_version: "7.0"
    with:
      os: ${{ matrix.os }}
      php_version: ${{ matrix.php_version }}
      app_name: ${{ inputs.app_name }}
      server: ${{ inputs.server }}
      tag_prefix: ${{ inputs.tag_prefix }}
      force_build: ${{ inputs.force_build }}
