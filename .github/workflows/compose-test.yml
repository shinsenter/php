name: Compose test

################################################################################
################################################################################

# Manual run after a release build: test each published server and webapp with compose-test.sh.
# Each service and OS is its own job, and a failed check does not fail the run (one job summary).
# It never builds or pushes an image.

on:
  workflow_dispatch:
    inputs:
      php_version:
        description: "PHP version to test, or latest (the images tagged latest)"
        required: false
        type: string
        default: "latest"
      tag_prefix:
        description: "Tag prefix of the images: empty for a release, dev- for the images built from a branch"
        required: false
        type: string
        default: ""
      services:
        description: "Services to test (names in tests/docker-compose.yml), separated by spaces (empty = all)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

################################################################################
################################################################################

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      services: ${{ steps.select.outputs.services }}
    steps:
      - uses: actions/checkout@v7

      # An empty list means all the services, except the ones that only support the others
      - name: Select the services
        id: select
        env:
          REQUESTED: ${{ inputs.services }}
        run: |
          all="$(IMAGE_TAG=x docker compose -f tests/docker-compose.yml config --services 2>/dev/null | grep -vx -e cli -e fpm -e mysql | tr '\n' ' ')"
          read -ra service_list <<<"${REQUESTED:-$all}"
          services_json="$(printf '%s\n' "${service_list[@]}" | jq -R . | jq -sc .)"
          echo "services=$services_json" | tee -a "$GITHUB_OUTPUT"

  compose-test:
    name: ${{ matrix.service }} ${{ matrix.os }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [debian, alpine]
        service: ${{ fromJSON(needs.prepare.outputs.services) }}
    steps:
      - uses: actions/checkout@v7

      # The test never fails the job, it only reports
      - name: Test the published image
        continue-on-error: true
        env:
          OS: ${{ matrix.os }}
          PHP_VERSION: ${{ inputs.php_version }}
          SERVICE: ${{ matrix.service }}
          TAG_PREFIX: ${{ inputs.tag_prefix }}
        run: tests/compose-test.sh -n 1 -o "$OS" -v "$PHP_VERSION" "$SERVICE"

      # Keep the result for the summary job
      - name: Upload the result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: result-${{ matrix.service }}-${{ matrix.os }}
          path: tests/logs/*-compose-*.csv
          if-no-files-found: ignore
          retention-days: 1

  # One summary: servers first, then webapps, sorted by name and OS
  summary:
    needs: compose-test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: src/webapps

      - uses: actions/download-artifact@v8
        with:
          pattern: result-*
          path: results

      - name: Write the summary
        env:
          PHP_VERSION: ${{ inputs.php_version }}
        run: |
          {
              echo "## Compose test, PHP $PHP_VERSION"
              # A folder in src/webapps means a webapp, otherwise a server
              for dir in results/result-*; do
                  [ -d "$dir" ] || continue
                  key="${dir#results/result-}"
                  name="${key%-*}"
                  if [ -d "src/webapps/$name" ]; then group=1; else group=0; fi
                  echo "$group $name ${key##*-}"
              done | sort -k1,1n -k2,2 -k3,3 | while read -r _ name os; do
                  echo "### $name, $os"
                  echo '```'
                  cat "results/result-$name-$os/"*.csv
                  echo '```'
              done
          } >>"$GITHUB_STEP_SUMMARY"
