# Settings for tests/tools/workflow-check.sh

self-hosted-runner:
  # A GitHub-hosted runner that the bundled label list does not know yet
  labels:
    - ubuntu-26.04-arm

paths:
  .github/workflows/**/*.yml:
    ignore:
      # Style notes on shell that works as written:
      # SC1007 is the empty "DEBUG= command" assignment, SC2012 and SC2207 are an ls and a command split, SC2129 is separate redirects
      - 'shellcheck reported issue in this script: SC(1007|2012|2129|2207):.+'
