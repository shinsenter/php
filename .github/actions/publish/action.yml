name: Publish
description: Put the per-platform digests in /tmp/digests under the build tags, then verify, sign and scan the result

inputs:
  continue-on-error:
    description: Let a failed publish step pass, for the images that may fail
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - # Size before the new image replaces the tag, empty for a first release
      name: Read the size of the current ${{ env.BUILD_TAG }}
      shell: bash
      run: |
        . ./build/helpers.sh
        echo "PREV_SIZE=$(get_image_size "ghcr.io/$BUILD_TAG")" >> "$GITHUB_ENV"

    -
      name: Publish ${{ env.BUILD_TAG }}
      continue-on-error: ${{ inputs.continue-on-error == 'true' }}
      shell: bash
      working-directory: /tmp/digests
      run: |
        set -e
        stage="$BUILD_NAME"
        [ "$PUBLISH_TO_GHCR" = "1" ] && stage="ghcr.io/$BUILD_NAME"

        tags=()
        for tag in ${BUILD_TAGS//,/ }; do
            tags+=(-t "$tag")
        done

        sources=()
        for digest in *; do
            sources+=("$stage@sha256:$digest")
        done

        docker buildx imagetools create "${tags[@]}" \
            --annotation "index:org.shinsenter.build.fingerprint=$BUILD_FINGERPRINT" \
            "${sources[@]}"
        docker buildx imagetools inspect "$BUILD_TAG"

    - # Without the fingerprint the next run would build this image again
      name: Verify the fingerprint of ${{ env.BUILD_TAG }}
      shell: bash
      run: |
        set -e
        . ./build/helpers.sh
        published="$(get_image_fingerprint "ghcr.io/$BUILD_TAG")"
        echo "expected  = $BUILD_FINGERPRINT"
        echo "published = $published"
        if [ "$published" != "$BUILD_FINGERPRINT" ]; then
            echo "::error::The published image does not carry the expected fingerprint"
            exit 1
        fi

    - # A warning only: a bigger image can be right (new PHP version, new extension)
      name: Compare the size of ${{ env.BUILD_TAG }}
      continue-on-error: true
      shell: bash
      run: |
        . ./build/helpers.sh
        now="$(get_image_size "ghcr.io/$BUILD_TAG")"
        [ -n "$now" ] || exit 0
        line="$(awk -v n="$now" -v p="${PREV_SIZE:-0}" 'BEGIN {
            printf "%.1f MB", n / 1048576
            if (p > 0) printf " (was %.1f MB, %+.1f%%)", p / 1048576, (n - p) * 100 / p
        }')"
        echo "$BUILD_TAG linux/amd64 compressed size: $line"
        echo "- \`$BUILD_TAG\` linux/amd64 compressed size: $line" >> "$GITHUB_STEP_SUMMARY"
        if awk -v n="$now" -v p="${PREV_SIZE:-0}" 'BEGIN { exit !(p > 0 && n > p * 1.03) }'; then
            echo "::warning::$BUILD_TAG grew more than 3%: $line"
        fi

    - # Keyless signature by digest, so the tags keep pointing at the same index
      uses: sigstore/cosign-installer@v4.1.3

    - # The signature is a separate artifact next to the image, a failure here does not block the release
      name: Sign ${{ env.BUILD_TAG }}
      continue-on-error: true
      shell: bash
      run: |
        set -e
        digest="$(docker buildx imagetools inspect "$BUILD_TAG" --format '{{.Manifest.Digest}}')"
        [ -n "$digest" ] || { echo "::error::No digest for $BUILD_TAG"; exit 1; }
        for repo in "$BUILD_NAME" "ghcr.io/$BUILD_NAME"; do
            cosign sign --yes "$repo@$digest"
        done

    - # Report only: PHP and OS packages carry CVEs that the image cannot fix on its own
      # The runner may be any architecture, so the scan names the platform the size check also uses
      name: Scan ${{ env.BUILD_TAG }}
      continue-on-error: true
      shell: bash
      run: |
        docker run --rm ghcr.io/aquasecurity/trivy:latest image --platform linux/amd64 \
            --quiet --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --timeout 10m --format table "ghcr.io/$BUILD_TAG" | head -c 200000 >/tmp/scan.txt
        {
            echo "### Vulnerabilities in $BUILD_TAG (HIGH and CRITICAL, fixed upstream)"
            echo '```'
            cat /tmp/scan.txt
            echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
