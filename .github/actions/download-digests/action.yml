name: Download digests
description: Download the digest artifacts of every platform into /tmp/digests, and retry once on a failure

inputs:
  pattern:
    description: Name pattern of the digest artifacts
    required: true

runs:
  using: composite
  steps:
    - # A fresh artifact can be listed before it can be downloaded
      id: first
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        path: /tmp/digests
        pattern: ${{ inputs.pattern }}
        merge-multiple: true

    - if: ${{ steps.first.outcome == 'failure' }}
      shell: bash
      run: sleep 15

    - if: ${{ steps.first.outcome == 'failure' }}
      uses: actions/download-artifact@v8
      with:
        path: /tmp/digests
        pattern: ${{ inputs.pattern }}
        merge-multiple: true
