name: Download digests
description: Fetch the digest artifact of each platform into /tmp/digests, each one by its exact name

inputs:
  fingerprint:
    description: Fingerprint of the image, part of the artifact names
    required: true
  slugs:
    description: Slugs of the platforms to fetch, separated by spaces
    required: true

runs:
  using: composite
  steps:
    # Ask the API by exact name, since a pattern only sees the first 1000 artifacts of a run
    # A platform that is not done yet is one info line, never an annotation: the errors are the build steps
    - shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        FINGERPRINT: ${{ inputs.fingerprint }}
        SLUGS: ${{ inputs.slugs }}
      run: |
        mkdir -p /tmp/digests
        missing=
        for slug in $SLUGS; do
          url="repos/$GITHUB_REPOSITORY/actions"
          id="$(gh api "$url/runs/$GITHUB_RUN_ID/artifacts?name=digest-$FINGERPRINT-$slug" --jq '.artifacts[0].id // empty' 2>/dev/null)" || id=
          if [ -n "$id" ] && gh api "$url/artifacts/$id/zip" >"/tmp/$slug.zip" 2>/dev/null && unzip -qo "/tmp/$slug.zip" -d /tmp/digests; then
            rm -f "/tmp/$slug.zip"
          else
            missing="$missing $slug"
          fi
        done
        [ -z "$missing" ] || echo "Digest not ready yet for:$missing"
