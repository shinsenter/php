name: Download digests
description: Fetch the digest artifact of each platform into /tmp/digests, each one by its exact name

inputs:
  fingerprint:
    description: Fingerprint of the image, part of the artifact names
    required: true
  slugs:
    description: Slugs of the platforms to fetch, separated by spaces
    required: true

runs:
  using: composite
  # Exact names: a pattern only sees the first 1000 artifacts of a run
  steps:
    - if: ${{ contains(inputs.slugs, 'linux-386') }}
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: digest-${{ inputs.fingerprint }}-linux-386
        path: /tmp/digests

    - if: ${{ contains(inputs.slugs, 'linux-amd64') }}
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: digest-${{ inputs.fingerprint }}-linux-amd64
        path: /tmp/digests

    - if: ${{ contains(inputs.slugs, 'linux-arm-v6') }}
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: digest-${{ inputs.fingerprint }}-linux-arm-v6
        path: /tmp/digests

    - if: ${{ contains(inputs.slugs, 'linux-arm-v7') }}
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: digest-${{ inputs.fingerprint }}-linux-arm-v7
        path: /tmp/digests

    - if: ${{ contains(inputs.slugs, 'linux-arm64-v8') }}
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: digest-${{ inputs.fingerprint }}-linux-arm64-v8
        path: /tmp/digests

    - if: ${{ contains(inputs.slugs, 'linux-ppc64le') }}
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: digest-${{ inputs.fingerprint }}-linux-ppc64le
        path: /tmp/digests

    - if: ${{ contains(inputs.slugs, 'linux-s390x') }}
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: digest-${{ inputs.fingerprint }}-linux-s390x
        path: /tmp/digests
