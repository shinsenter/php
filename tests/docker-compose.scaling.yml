# Simulates scaling: Traefik in front of several replicas of one image.
# Run it through tests/scaling-test.sh <image>, which sets SCALING_IMAGE.
services:

  traefik:
    image: traefik:v3
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      # test only: accept X-Forwarded-* from the test client, so the test can send them
      - --entrypoints.web.forwardedheaders.insecure=true
    ports:
      - "${SCALING_PORT:-8180}:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  app:
    build:
      context: ./scaling
      dockerfile: ${SCALING_DOCKERFILE:-Dockerfile}
      args:
        SCALING_IMAGE: ${SCALING_IMAGE:?set SCALING_IMAGE or use tests/scaling-test.sh}
    environment:
      - DISABLE_GREETING=1
    stop_grace_period: 30s
    labels:
      - traefik.enable=true
      - traefik.http.routers.app.rule=PathPrefix(`/`)
      - traefik.http.routers.app.entrypoints=web
      - traefik.http.services.app.loadbalancer.server.port=80
    # the images have no HEALTHCHECK, so it is defined here and reads HEALTH_CHECK_URL of the image
    healthcheck:
      test: ["CMD-SHELL", "with-env sh -c 'curl -sf \"$$HEALTH_CHECK_URL\" >/dev/null'"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 20s
