x-app: &app
  extends:
    service: cli

services:

  cli:
    image: ghcr.io/shinsenter/php:dev-cli-alpine
    security_opt:
      - no-new-privileges:true
    privileged: true
    cap_add:
      - SYS_ADMIN
      - SYS_NICE
      - SYS_PTRACE
    environment:
      - TZ=Asia/Tokyo
      - DEBUG=${DEBUG}
      - ENABLE_CRONTAB=${ENABLE_CRONTAB}
      - PHP_POOL_NAME=shin
      - ENABLE_TUNING_FPM=1
      - ENABLE_TUNING_MPM=1
      - APP_GROUP=mygroup
      - APP_GID=5555
      - APP_USER=myuser
      - APP_UID=5555

  fpm:
    image: ghcr.io/shinsenter/php:dev-fpm-alpine
    extends:
      service: cli
    ports:
      - 9000:9000

  ##########################################################

  phpfpm-nginx:  { <<: *app, image: "ghcr.io/shinsenter/phpfpm-nginx:${IMAGE_TAG}",  ports: ["8101:80", "8201:443"] }
  phpfpm-apache: { <<: *app, image: "ghcr.io/shinsenter/phpfpm-apache:${IMAGE_TAG}", ports: ["8102:80", "8202:443"] }
  frankenphp:    { <<: *app, image: "ghcr.io/shinsenter/frankenphp:${IMAGE_TAG}",    ports: ["8103:80", "8203:443"] }
  roadrunner:    { <<: *app, image: "ghcr.io/shinsenter/roadrunner:${IMAGE_TAG}",    ports: ["8104:80", "8204:443"] }

  ##########################################################

  # Shared by the webapps that need a database (see depends_on). MariaDB speaks the MySQL protocol and is smaller.
  # It keeps its data in memory, so every batch of compose-test.sh starts with an empty database.
  mysql:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: test
      MARIADB_DATABASE: test
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 3s
      retries: 40

  ##########################################################

  bagisto:       { <<: *app, image: "ghcr.io/shinsenter/bagisto:${IMAGE_TAG}",       ports: ["8105:80", "8205:443"] }
  bedrock:       { <<: *app, image: "ghcr.io/shinsenter/bedrock:${IMAGE_TAG}",       ports: ["8106:80", "8206:443"] }
  cakephp5:      { <<: *app, image: "ghcr.io/shinsenter/cakephp5:${IMAGE_TAG}",      ports: ["8107:80", "8207:443"] }
  codeigniter4:  { <<: *app, image: "ghcr.io/shinsenter/codeigniter4:${IMAGE_TAG}",  ports: ["8108:80", "8208:443"] }
  coolify:       { <<: *app, image: "ghcr.io/shinsenter/coolify:${IMAGE_TAG}",       ports: ["8109:80", "8209:443"] }
  drupal:        { <<: *app, image: "ghcr.io/shinsenter/drupal:${IMAGE_TAG}",        ports: ["8110:80", "8210:443"] }
  espocrm:       { <<: *app, image: "ghcr.io/shinsenter/espocrm:${IMAGE_TAG}",       ports: ["8111:80", "8211:443"] }
  flarum:        { <<: *app, image: "ghcr.io/shinsenter/flarum:${IMAGE_TAG}",        ports: ["8112:80", "8212:443"] }
  flightphp:     { <<: *app, image: "ghcr.io/shinsenter/flightphp:${IMAGE_TAG}",     ports: ["8113:80", "8213:443"] }
  grav:          { <<: *app, image: "ghcr.io/shinsenter/grav:${IMAGE_TAG}",          ports: ["8114:80", "8214:443"] }
  hyperf:        { <<: *app, image: "ghcr.io/shinsenter/hyperf:${IMAGE_TAG}",        ports: ["8115:80", "8215:443"] }
  invoiceshelf:  { <<: *app, image: "ghcr.io/shinsenter/invoiceshelf:${IMAGE_TAG}",  ports: ["8116:80", "8216:443"] }
  kirby:         { <<: *app, image: "ghcr.io/shinsenter/kirby:${IMAGE_TAG}",         ports: ["8117:80", "8217:443"] }
  laravel:       { <<: *app, image: "ghcr.io/shinsenter/laravel:${IMAGE_TAG}",       ports: ["8118:80", "8218:443"] }
  magento:       { <<: *app, image: "ghcr.io/shinsenter/magento:${IMAGE_TAG}",       ports: ["8119:80", "8219:443"] }
  matomo:        { <<: *app, image: "ghcr.io/shinsenter/matomo:${IMAGE_TAG}",        ports: ["8120:80", "8220:443"] }
  mautic:        { <<: *app, image: "ghcr.io/shinsenter/mautic:${IMAGE_TAG}",        ports: ["8121:80", "8221:443"] }
  phpmyadmin:    { <<: *app, image: "ghcr.io/shinsenter/phpmyadmin:${IMAGE_TAG}",    ports: ["8122:80", "8222:443"] }
  spiral:        { <<: *app, image: "ghcr.io/shinsenter/spiral:${IMAGE_TAG}",        ports: ["8123:80", "8223:443"] }
  statamic:      { <<: *app, image: "ghcr.io/shinsenter/statamic:${IMAGE_TAG}",      ports: ["8124:80", "8224:443"] }
  # Sulu needs its tables before / answers, and the image does not create them, so a test hook runs sulu:build.
  sulu:
    <<: *app
    image: "ghcr.io/shinsenter/sulu:${IMAGE_TAG}"
    ports: ["8125:80", "8225:443"]
    environment:
      - DATABASE_URL=mysql://root:test@mysql:3306/test?serverVersion=mariadb-11.4.0&charset=utf8mb4
    volumes:
      - ./compose-hooks/90-sulu-build:/etc/hooks/post-create-project/90-sulu-build:ro
    depends_on:
      mysql: { condition: service_healthy }
  symfony:       { <<: *app, image: "ghcr.io/shinsenter/symfony:${IMAGE_TAG}",       ports: ["8126:80", "8226:443"] }
  wordpress:     { <<: *app, image: "ghcr.io/shinsenter/wordpress:${IMAGE_TAG}",     ports: ["8127:80", "8227:443"] }
  yii:           { <<: *app, image: "ghcr.io/shinsenter/yii:${IMAGE_TAG}",           ports: ["8128:80", "8228:443"] }
  # Craft needs its tables and a first user before / answers, so a test hook runs the install.
  craftcms:
    <<: *app
    image: "ghcr.io/shinsenter/craftcms:${IMAGE_TAG}"
    ports: ["8129:80", "8229:443"]
    environment:
      - CRAFT_DB_DRIVER=mysql
      - CRAFT_DB_SERVER=mysql
      - CRAFT_DB_PORT=3306
      - CRAFT_DB_DATABASE=test
      - CRAFT_DB_USER=root
      - CRAFT_DB_PASSWORD=test
      - CRAFT_DB_TABLE_PREFIX=craft_
    volumes:
      - ./compose-hooks/90-craft-install:/etc/hooks/post-create-project/90-craft-install:ro
    depends_on:
      mysql: { condition: service_healthy }
  joomla:        { <<: *app, image: "ghcr.io/shinsenter/joomla:${IMAGE_TAG}",        ports: ["8130:80", "8230:443"] }
  nextcloud:     { <<: *app, image: "ghcr.io/shinsenter/nextcloud:${IMAGE_TAG}",     ports: ["8131:80", "8231:443"] }
  prestashop:    { <<: *app, image: "ghcr.io/shinsenter/prestashop:${IMAGE_TAG}",    ports: ["8132:80", "8232:443"] }
  shopware:      { <<: *app, image: "ghcr.io/shinsenter/shopware:${IMAGE_TAG}",      ports: ["8133:80", "8233:443"] }
  tempest:       { <<: *app, image: "ghcr.io/shinsenter/tempest:${IMAGE_TAG}",       ports: ["8134:80", "8234:443"] }
