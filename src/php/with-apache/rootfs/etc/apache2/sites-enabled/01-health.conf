# Health checks on their own port, so they answer for any Host header, without TLS and apart from the app routes.
# The port is not exposed: orchestrators call it on the container address.
Listen ${HEALTH_PORT}
<VirtualHost *:${HEALTH_PORT}>
    ServerName health
    RewriteEngine On

    # /healthz answers without PHP, so it tells that the web server is up.
    RewriteRule ^/healthz$ - [R=200,L]

    # /readyz asks PHP-FPM for its ping page, so it tells that PHP can serve requests.
    <Location "/readyz">
        ProxyFCGIBackendType FPM
        ProxyFCGISetEnvIf "true" SCRIPT_NAME "${PHP_PING_PATH}"
        ProxyFCGISetEnvIf "true" SCRIPT_FILENAME "${PHP_PING_PATH}"
        SetHandler "proxy:unix:${PHP_LISTEN}|fcgi://localhost"
    </Location>

    RewriteCond %{REQUEST_URI} !^/readyz$
    RewriteRule ^ - [R=404,L]
</VirtualHost>
