# Scheme and HTTPS flag that PHP sees behind a load balancer or Traefik that ends TLS.
# X-Forwarded-Proto is trusted only when real_ip accepted X-Forwarded-For from a trusted proxy.
# In that case $realip_remote_addr (the proxy) differs from $remote_addr (the client).
set $client_https  $https;
set $client_scheme $scheme;
set $proxy_flag    "";

if ($realip_remote_addr != $remote_addr) {
    set $proxy_flag T;
}

if ($http_x_forwarded_proto = https) {
    set $proxy_flag "${proxy_flag}S";
}

if ($proxy_flag = TS) {
    set $client_https  on;
    set $client_scheme https;
}
