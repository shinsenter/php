# default index
root    $APP_ROOT;
index   index.php index.html;

# logging
access_log /proc/1/fd/2 custom;
error_log  /proc/1/fd/2 error;

# security headers
include /etc/nginx/snippets/security-headers.conf;

# . files
location ~ /\.(?!well-known) {
    deny all;
}

# favicon.ico
location = /favicon.ico {
    expires 1d;
    access_log off;
}

# svg, fonts
location ~* \.(?:ttf|ttc|otf|eot|woff2?)$ {
    add_header Access-Control-Allow-Origin "*";
    include /etc/nginx/snippets/security-headers.conf;
    expires 30d;
    access_log off;
}

# robots.txt
location = /robots.txt {
    access_log off;
    try_files $uri /index.php$is_args$args;
}

# css, js
location ~* \.(?:css(\.map)?|js(\.map)?)$ {
    add_header Access-Control-Allow-Origin "*";
    include /etc/nginx/snippets/security-headers.conf;
    expires 30d;
    access_log off;
    try_files $uri /index.php$is_args$args;
}

# images
location ~* \.(?:svgz?|jpe?g|png|gif|ico|cur|heic|webp|tiff?)$ {
    add_header Access-Control-Allow-Origin "*";
    include /etc/nginx/snippets/security-headers.conf;
    expires 30d;
    access_log off;
    try_files $uri /index.php$is_args$args;
}

# media
location ~* \.(?:mp3|m4a|aac|ogg|midi?|wav|mp4|mov|webm|mpe?g|avi|ogv|flv|wmv)$ {
    add_header Access-Control-Allow-Origin "*";
    include /etc/nginx/snippets/security-headers.conf;
    expires max;
    access_log off;
}

# handle .php
location ~ [^/]\.php(/|$) {
    fastcgi_pass @php;

    # split path
    fastcgi_split_path_info ^(.+\.php)(/.+)$;
    set $_fastcgi_path_info $fastcgi_path_info;

    # 404
    try_files $fastcgi_script_name 404;

    # default fastcgi_params
    include fastcgi_params;

    # fastcgi settings
    fastcgi_index       index.php;
    fastcgi_keep_conn   on;
    fastcgi_buffers     8 16k;
    fastcgi_buffer_size 32k;

    # fastcgi params
    fastcgi_param DOCUMENT_ROOT     $realpath_root;
    fastcgi_param SCRIPT_FILENAME   $realpath_root$fastcgi_script_name;
    fastcgi_param PATH_INFO         $_fastcgi_path_info;
    fastcgi_param HTTPS             $client_https if_not_empty;
    fastcgi_param REQUEST_SCHEME    $client_scheme;
}
